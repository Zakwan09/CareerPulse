<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareerPulse — Skill Trends</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <div class="app-shell">
    {% include "_sidebar.html" %}
    <main class="main">
      <div class="page-header">
        <h2>Skill Trends &amp; Forecast</h2>
        <p>Monthly posting history and a simple linear-trend forecast per skill.</p>
      </div>

      <div class="filters">
        <select id="skill-select"><option value="">Select a skill...</option></select>
      </div>

      <div class="card">
        <h3>Demand Over Time</h3>
        <canvas id="trend-chart" height="200"></canvas>
        <div id="forecast-note" style="margin-top:14px; font-size:13px; color:var(--cp-text-dim);"></div>
      </div>
    </main>
  </div>

  <script src="/static/js/auth.js"></script>
  <script src="/static/js/trends.js"></script>
</body>
</html>
